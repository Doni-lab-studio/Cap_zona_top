<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shapky vsim | Головні убори оптом та в роздріб</title>
  
  <!-- Подключение иконок FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Подключение шрифта Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #06040a 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-color: #00f2fe;
      --text-main: #ffffff;
      --text-muted: #a0a5ba;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Основной контейнер */
    .card-container {
      width: 100%;
      max-width: 440px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Логотип и заголовок */
    .brand-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(45deg, #ffffff, #a8c0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      text-transform: lowercase;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-weight: 600;
    }

    /* Карточка статуса / Важные детали */
    .info-badge {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 24px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* Сетка кнопок мессенджеров (Telegram и Viber) */
    .messengers-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .btn-social {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 10px;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-social i {
      font-size: 1.6rem;
    }

    .btn-social:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-tg { background: linear-gradient(135deg, #2AABEE, #229ED9); }
    .btn-viber { background: linear-gradient(135deg, #7360F2, #59267c); }

    /* Блок телефона */
    .phone-block {
      margin-bottom: 24px;
    }

    .phone-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .phone-number {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50px;
      border: 1px solid var(--glass-border);
      transition: all 0.3s ease;
    }

    .phone-number:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.03);
    }

    .work-hours {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Акцентная кнопка Каталога */
    .catalog-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 18px;
      margin-bottom: 24px;
      box-shadow: 0 8px 25px rgba(0, 114, 255, 0.4);
      transition: all 0.3s ease;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 198, 255, 0.5); }
      70% { box-shadow: 0 0 0 15px rgba(0, 198, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 198, 255, 0); }
    }

    .catalog-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    /* Информация про доставку */
    .delivery-info {
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- Заголовок / Логотип -->
    <h1 class="brand-title">shapky vsim</h1>
    <p class="brand-subtitle">Головні убори оптом та в роздріб</p>

    <!-- Информация -->
    <div class="info-badge">
      ⚡ <b>Індивідуальний підхід до кожного</b><br>
      <span style="font-size: 0.85rem; color: var(--text-muted);">Замовлення приймаємо в будь-якому месенджері</span>
    </div>

    <!-- Кнопки мессенджеров (Telegram и Viber) -->
    <div class="messengers-grid">
      <a href="https://t.me/ira0200" class="btn-social btn-tg" target="_blank">
        <i class="fa-brands fa-telegram"></i>
        Telegram
      </a>
      <a href="https://msng.link/o/?380970010601=vi" class="btn-social btn-viber" target="_blank">
        <i class="fa-brands fa-viber"></i>
        Viber
      </a>
    </div>

    <!-- Телефон -->
    <div class="phone-block">
      <div class="phone-title">Телефон для замовлення:</div>
      <a href="tel:+380970010601" class="phone-number">
        <i class="fa-solid fa-phone"></i>
        +38 097 001 0601
      </a>
      <div class="work-hours">⏰ Працюємо з Пн-Нд: 9:00 - 19:00</div>
    </div>

    <!-- Каталог товаров -->
    <a href="https://t.me/ira0200" class="catalog-btn" target="_blank">
      <i class="fa-solid fa-store"></i>
      Каталог товару в Telegram
    </a>

    <!-- Доставка -->
    <div class="delivery-info">
      🚚 Доставка по всій Україні 🇺🇦
    </div>

  </div>

</body>
</html>
