<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shapky vsim | Головні убори в роздріб</title>
  
  <!-- Підключення іконок FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Підключення шрифту Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #06040a 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-muted: #a0a5ba;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Основний контейнер */
    .card-container {
      width: 100%;
      max-width: 440px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Логотип і заголовок */
    .brand-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(45deg, #ffffff, #a8c0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      text-transform: lowercase;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-weight: 600;
    }

    /* Картка статусу */
    .info-badge {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 16px 14px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      justify-content: center;
    }

    .info-primary {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-sub i.fa-telegram {
      color: #2AABEE;
    }

    .info-sub i.fa-viber {
      color: #7360F2;
    }

    .arrow-bounce {
      display: inline-block;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(6px);
      }
      60% {
        transform: translateY(3px);
      }
    }

    /* Блок телефону та кнопок */
    .phone-block {
      margin-bottom: 24px;
    }

    .phone-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .phone-number {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50px;
      border: 1px solid var(--glass-border);
      transition: all 0.3s ease;
      margin-bottom: 12px;
    }

    .phone-number:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.03);
    }

    /* Кнопка Viber */
    .viber-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 20px;
      background: #7360F2;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(115, 96, 242, 0.4);
      transition: all 0.3s ease;
    }

    .viber-btn:hover {
      background: #5e4bd8;
      box-shadow: 0 6px 20px rgba(115, 96, 242, 0.6);
      transform: translateY(-2px);
    }

    .viber-btn i {
      font-size: 1.2rem;
    }

    .work-hours {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 12px;
    }

    /* Інформація про доставку */
    .delivery-info {
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- Заголовок / Логотип -->
    <h1 class="brand-title">shapky vsim</h1>
    <p class="brand-subtitle">Головні убори в роздріб</p>

    <!-- Інформаційне повідомлення -->
    <div class="info-badge">
      <div class="info-primary">
        Замовлення приймаємо за цим номером <span class="arrow-bounce">👇</span>
      </div>
      <div class="info-sub">
        (в Telegram <i class="fa-brands fa-telegram"></i> та Viber <i class="fa-brands fa-viber"></i>)
      </div>
    </div>

    <!-- Блок з номером телефону та кнопкою Viber -->
    <div class="phone-block">
      <div class="phone-title">Телефон для замовлення:</div>
      
      <!-- Звонок -->
      <a href="tel:+380970010601" class="phone-number">
        <i class="fa-solid fa-phone"></i>
        +38 097 001 0601
      </a>

      <!-- 100% рабочая кнопка Viber -->
      <a href="https://viber.click/380970010601" target="_blank" class="viber-btn">
        <i class="fa-brands fa-viber"></i>
        Написати в Viber
      </a>

      <div class="work-hours">⏰ Працюємо з Пн-Нд: 9:00 - 19:00</div>
    </div>

    <!-- Доставка -->
    <div class="delivery-info">
      🚚 Доставка по всій Україні 🇺🇦
    </div>

  </div>

</body>
</html>
